<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto Genesis - Desafios Diários para Sair da Inércia</title>
    <script>
      (function() {
        try {
          var origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = origFetch;

          var descriptor = {
            get: function() { return _currentFetch; },
            set: function(newFetch) {
              if (typeof newFetch === 'function') {
                _currentFetch = newFetch;
              }
            },
            configurable: true,
            enumerable: true
          };

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e) {}
          }

          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', descriptor);
            } catch (e) {}
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
